name: Saint Joseph of Cupertino, Priest
subtitle: 1603–1663
blurb: An Italian Conventual Franciscan friar who was ordained in 1628 despite
  struggling with formal studies. His ecstatic levitations during prayer drew
  crowds and repeated transfers between friaries; he met the scrutiny with
  humility and obedience.
notification: St. Joseph of Cupertino, pray for us!
