name: The Nativity of the Blessed Virgin Mary
subtitle: Feast, September 8
blurb: The Nativity of the Blessed Virgin Mary, celebrated September 8,
  commemorates Mary's birth, an event not recorded in the canonical Gospels but
  drawn from the second-century Protoevangelium of James, which names her
  parents as Joachim and Anne. It is one of only three birthdays in the
  liturgical calendar — alongside Christ's and John the Baptist's — and the date
  fixes the Immaculate Conception nine months earlier on December 8.
notification: Your birth, O Virgin Mother of God, proclaimed joy to the whole world.
