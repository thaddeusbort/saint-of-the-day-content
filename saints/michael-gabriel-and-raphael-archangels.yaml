name: Saints Michael, Gabriel and Raphael, Archangels
subtitle: Feast, September 29
blurb: >-
  The three archangels named in scripture, kept together since 1969 on the
  dedication day of St Michael's basilica on the Via Salaria. Michael leads the
  heavenly host against the dragon, Gabriel announces the Incarnation to Mary,
  and Raphael travels with Tobias and heals his father's blindness — the
  warrior, the messenger and the healer.
notification: Holy Archangels, pray for us!
credit: Raphael (Raffaello Sanzio), 1518
