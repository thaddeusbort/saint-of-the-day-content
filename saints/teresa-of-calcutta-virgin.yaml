name: Saint Teresa of Calcutta, Virgin
subtitle: 1910–1997
blurb: Saint Teresa of Calcutta, born Anjezë Gonxhe Bojaxhiu in Skopje to an
  Albanian family, left her teaching post with the Loreto Sisters in 1946 to
  work among the destitute and dying in Calcutta's slums, founding the
  Missionaries of Charity two years later. She received the Nobel Peace Prize in
  1979 and was canonized by Pope Francis in 2016.
notification: St. Teresa of Calcutta, pray for us!
