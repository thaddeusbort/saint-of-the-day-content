name: Saint Peter Claver, Priest
subtitle: 1580-1654
blurb: Saint Peter Claver was a Spanish Jesuit who spent forty years at
  Cartagena, the main slave port of the Spanish Americas, meeting arriving ships
  to bring food, water, and medical care to the enslaved Africans aboard before
  catechizing them. He called himself the slave of the Africans forever, is said
  to have baptized some 300,000 people, and was canonized in 1888.
notification: St. Peter Claver, pray for us!
