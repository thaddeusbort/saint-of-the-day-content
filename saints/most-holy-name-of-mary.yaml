name: The Most Holy Name of Mary
subtitle: Optional Memorial, September 12
blurb: >-
  A feast of the name of the Blessed Virgin, kept on the octave day of her
  Nativity. Extended to the universal calendar by Innocent XI in 1684 in
  thanksgiving for the lifting of the siege of Vienna the previous year, it was
  dropped from the calendar in 1969 and restored by John Paul II in 2002.
notification: Holy Mary, Mother of God, pray for us!
