name: Saints Cosmas and Damian, Martyrs
subtitle: Third century
blurb: According to early Christian tradition, twin brothers and physicians in
  Cilicia who treated the sick without payment, earning the name ‘the moneyless
  ones.’ They were martyred during Diocletian’s persecution and became patrons
  of physicians, surgeons, and pharmacists.
notification: Sts. Cosmas and Damian, pray for us!
