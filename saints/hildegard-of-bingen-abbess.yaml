name: Saint Hildegard of Bingen, Abbess and Doctor of the Church
subtitle: 1098–1179
blurb: A twelfth-century Benedictine abbess who founded monasteries near Bingen,
  preached across Germany, and recorded her visions in Scivias. Her surviving
  works range across theology, medicine, natural science, and sacred music; Pope
  Benedict XVI named her a Doctor of the Church in 2012.
notification: St. Hildegard of Bingen, pray for us!
