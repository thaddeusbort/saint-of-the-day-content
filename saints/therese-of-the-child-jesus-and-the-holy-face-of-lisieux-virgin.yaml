name: St. Thérèse of Lisieux
subtitle: 1873–1897
blurb: >-
  French Carmelite nun whose “little way” taught holiness through ordinary
  acts done with trust and love. Her spiritual autobiography, Story of a Soul,
  spread her teaching around the world, and Pope John Paul II named her a
  Doctor of the Church in 1997.
