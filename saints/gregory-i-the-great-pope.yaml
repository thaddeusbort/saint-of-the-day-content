name: Saint Gregory the Great, Pope and Doctor of the Church
years: 540-604
blurb: St. Gregory the Great was a Roman aristocrat who gave up a political
  career to become a monk before being elected pope in 590, guiding Rome through
  plague, famine, and Lombard invasions while reorganizing Church lands to feed
  the poor. He sent Augustine of Canterbury to convert the English, wrote
  influential works like the Pastoral Rule and Moralia on Job, shaped Western
  liturgy (Gregorian chant bears his name), and is honored as one of the four
  great Doctors of the Latin Church.
credit: Francisco Goya, 1796/1799
