name: Saint Teresa of Jesus, Virgin and Doctor of the Church
subtitle: 1515–1582
blurb: >-
  Spanish Carmelite who reformed her order into the Discalced Carmelites
  against determined opposition, founding seventeen houses in twenty years
  while writing The Interior Castle and the Life. In 1970 she became the first
  woman named a Doctor of the Church.
