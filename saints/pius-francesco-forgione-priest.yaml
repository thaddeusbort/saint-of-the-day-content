name: Saint Pius of Pietrelcina, Priest
subtitle: 1887–1968
blurb: Born Francesco Forgione, this Capuchin priest spent more than fifty years
  at San Giovanni Rotondo, where crowds sought his Masses, confessions, and
  spiritual counsel. He bore the stigmata and founded the Casa Sollievo della
  Sofferenza hospital, which opened in 1956.
notification: St. Pius of Pietrelcina, pray for us!
