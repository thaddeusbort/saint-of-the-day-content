name: Saint Wenceslaus, Martyr
subtitle: c. 907–935
blurb: A tenth-century duke of Bohemia who promoted Christianity, supported
  priests, and built churches while ruling his young state. He was killed at
  Stará Boleslav in a struggle with his brother Boleslav and was soon venerated
  as a martyr and patron of the Czech lands.
notification: St. Wenceslaus, pray for us!
